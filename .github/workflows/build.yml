name: build

on:
  push:
    paths-ignore:
      - '**.md'
      - 'LICENSE*'

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-download-url: https://github.com/oven-sh/bun/releases/download/bun-v1.3.14/bun-windows-x64-baseline.zip

      - name: deps
        shell: bash
        run: |
          (cd ui && bun install --frozen-lockfile)
          (cd proto && bun install --frozen-lockfile)

      - name: build
        shell: cmd
        run: call "%GITHUB_WORKSPACE%\ui\build.cmd"

      - name: test
        shell: bash
        run: |
          ./vtx2exl.exe --selftest
          ./VTX2EXL-UI.exe --smoke
          node analyzer/test.mjs
          node tests/mo2.mjs
          (cd ui && bun test)

      - name: sums
        shell: bash
        run: sha256sum VTX2EXL-UI.exe vtx2exl.exe > SHA256SUMS.txt

      - uses: actions/upload-artifact@v7
        with:
          name: vtx2exl
          path: |
            VTX2EXL-UI.exe
            vtx2exl.exe
            SHA256SUMS.txt

      - name: draft
        if: github.ref == 'refs/heads/main'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for id in $(gh api "repos/$GITHUB_REPOSITORY/releases" --paginate --jq '.[] | select(.draft) | .id'); do
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$id"
          done
          gh release create "v1.0.$GITHUB_RUN_NUMBER" VTX2EXL-UI.exe vtx2exl.exe SHA256SUMS.txt \
            --draft --target "$GITHUB_SHA" --title "v1.0.$GITHUB_RUN_NUMBER" --generate-notes \
            --notes 'VTX2EXL-UI.exe: консольный интерфейс, ядро уже внутри. vtx2exl.exe: только ядро, для командной строки.'
